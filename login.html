<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — MJM Training Center</title>
<meta name="description" content="Sign in to the MJM Training Center to track your training and practical records.">
<meta name="theme-color" content="#1E3A20">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="gate">
  <div class="gate-card">
    <div class="login-brand">
      <span class="mjm">MJM</span> Training Center
    </div>
    <div class="lock"><i class="fa-solid fa-circle-user"></i></div>
    <h2>Sign in</h2>
    <p>Enter your name and staff ID. Your training and practical records are kept under your ID.</p>
    <form id="loginForm">
      <input class="plain" type="text" id="fullName" maxlength="60" placeholder="Full name" autocomplete="name">
      <input class="plain" type="text" id="staffId" maxlength="20" placeholder="Staff ID" autocomplete="username">
      <div class="gate-err" id="err"></div>
      <button class="btn" type="submit" style="width:100%;justify-content:center;margin-top:4px">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign in
      </button>
    </form>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
(function(){
  // Already signed in? Go straight to the hub.
  if(MJM.user()){ location.replace('index.html'); return; }

  var form=document.getElementById('loginForm'),
      nameIn=document.getElementById('fullName'),
      idIn=document.getElementById('staffId'),
      err=document.getElementById('err'),
      gate=document.querySelector('.gate');

  function fail(msg){
    err.textContent=msg;
    gate.classList.remove('shake'); void gate.offsetWidth;
    gate.classList.add('shake');
  }

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var name=nameIn.value.trim();
    var id=idIn.value.trim().toLowerCase().replace(/\s+/g,'');
    if(!name){ fail('Please enter your full name.'); nameIn.focus(); return; }
    if(!/^[a-z0-9\-]{2,}$/.test(id)){ fail('Staff ID: at least 2 letters or numbers.'); idIn.focus(); return; }
    try{
      var users=JSON.parse(localStorage.getItem('mjm-users')||'{}');
      users[id]={name:name};
      localStorage.setItem('mjm-users',JSON.stringify(users));
      localStorage.setItem('mjm-user',id);
      localStorage.setItem('mjm-u-'+id+'-name',name);
    }catch(ex){ fail('Your browser is blocking storage — records can\'t be saved.'); return; }
    location.href='index.html';
  });
})();
</script>

</body>
</html>
